# Render Blueprint — SkySync
#
# Use isto para criar o serviço automaticamente: no painel do Render,
# New → Blueprint → aponte para este repositório. O Render lê este arquivo e
# monta o serviço com a configuração certa.
#
# As variáveis marcadas com `sync: false` NÃO ficam no repositório: o Render
# pede o valor no painel. É onde entra a DATABASE_URL do Neon e a SECRET_KEY.

services:
  - type: web
    name: skysync-api
    runtime: python
    plan: free
    region: oregon
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --timeout 120 --workers 1
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.10"

      # Produção: sem debug, sem o debugger do Werkzeug exposto.
      - key: SKYSYNC_ENV
        value: production

      # --- obrigatórias: o Render pede o valor no painel ---
      - key: DATABASE_URL
        sync: false
      - key: SKYSYNC_SECRET_KEY
        sync: false

      # --- cross-origin: o front vem do GitHub Pages, a API do Render ---
      # Sem estas três, o cookie de sessão NÃO viaja entre as origens e o
      # login falha em silêncio (a API responde, mas ninguém fica logado).
      - key: SKYSYNC_CORS_ORIGINS
        sync: false
      - key: SKYSYNC_COOKIE_SAMESITE
        value: None
      - key: SKYSYNC_COOKIE_SECURE
        value: "1"

      # Otimizador: teto menor em produção, porque o plano free tem 512 MB.
      - key: SKYSYNC_SOLVER_MAX_TIME
        value: "20"
      - key: SKYSYNC_HOUR_LIMIT
        value: "11.0"
